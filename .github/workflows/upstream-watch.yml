name: Upstream watch

# Notifies (via a GitHub issue) when Leaf or Sakura push a new commit to their
# 1.21.11 branches, so Fuji can be kept in sync. Existing issues act as the
# "already seen" state, so no extra storage or commits are needed.

on:
  schedule:
    - cron: '0 * * * *'      # hourly
  workflow_dispatch: {}        # manual run / test

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Leaf
            repo: Winds-Studio/Leaf
            branch: ver/1.21.11
            label: 'upstream:leaf'
            color: '7C6BC4'
          - name: Sakura
            repo: Samsuik/Sakura
            branch: '1.21.11'
            label: 'upstream:sakura'
            color: 'ED93B1'
    steps:
      - name: Check ${{ matrix.name }} (${{ matrix.branch }})
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          LABEL: ${{ matrix.label }}
          COLOR: ${{ matrix.color }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail

          # Latest commit on the upstream branch
          commit=$(gh api "repos/$REPO/commits/$BRANCH")
          sha=$(jq -r '.sha' <<<"$commit")
          short=${sha:0:7}
          msg=$(jq -r '.commit.message | split("\n")[0]' <<<"$commit")
          titlemsg=$(printf '%s' "$msg" | cut -c1-60)
          author=$(jq -r '.commit.author.name' <<<"$commit")
          date=$(jq -r '.commit.author.date' <<<"$commit")
          url=$(jq -r '.html_url' <<<"$commit")

          # Ensure the per-fork label exists
          gh label create "$LABEL" -R "$GITHUB_REPOSITORY" --color "$COLOR" \
            --description "$NAME $BRANCH upstream commits" 2>/dev/null || true

          # Already notified for this commit? (existing issues = state)
          seen=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --label "$LABEL" \
                   --search "$short in:title" --json number --jq 'length')
          if [ "$seen" != "0" ]; then
            echo "Already filed for $NAME $short — nothing to do."
            exit 0
          fi

          # Previous seen sha (from the most recent existing issue) -> compare + diff
          prev=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --label "$LABEL" \
                   --limit 1 --json title --jq '.[0].title // ""' \
                   | grep -oE '[0-9a-f]{7}' | head -1 || true)
          compare=""
          stats=""
          filelist=""
          if [ -n "$prev" ] && [ "$prev" != "$short" ]; then
            compare="https://github.com/$REPO/compare/$prev...$sha"
            cmp=$(gh api "repos/$REPO/compare/$prev...$sha" 2>/dev/null || echo '{}')
            ncommits=$(jq -r '.total_commits // 0' <<<"$cmp")
            add=$(jq -r '[.files[]?.additions] | add // 0' <<<"$cmp")
            del=$(jq -r '[.files[]?.deletions] | add // 0' <<<"$cmp")
            nfiles=$(jq -r '[.files[]?] | length' <<<"$cmp")
            stats="**$ncommits** commit(s) · **$nfiles** file(s) · **+$add / -$del**"
            filelist=$(jq -r '[.files[]? | "- `\(.status)` `\(.filename)` (+\(.additions)/-\(.deletions))"] | .[:30] | join("\n")' <<<"$cmp")
          fi

          # Build the issue body
          {
            echo "A new commit landed on **$NAME** \`$BRANCH\`."
            echo ""
            echo "- **Commit:** [\`$short\`]($url) — $msg"
            echo "- **Author:** $author"
            echo "- **Date:** $date"
            echo "- **Branch:** https://github.com/$REPO/tree/$BRANCH"
            echo "- **Recent commits:** https://github.com/$REPO/commits/$BRANCH"
            if [ -n "$compare" ]; then
              echo "- **Diff since last seen:** [compare]($compare) · [.diff]($compare.diff) · [.patch]($compare.patch)"
            fi
            if [ -n "$stats" ]; then
              echo ""
              echo "$stats"
              echo ""
              echo "<details><summary>Changed files</summary>"
              echo ""
              echo "$filelist"
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "---"
            echo "_Auto-filed by \`upstream-watch\`. Review the diff and decide whether to port it into Fuji, then close this issue._"
          } > body.md

          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "⬆️ $NAME upstream: $short — $titlemsg" \
            --label "$LABEL" \
            --body-file body.md

          echo "Filed notification issue for $NAME $short."
