name: Build Fuji

# Builds Fuji on every source/patch change so a broken build is caught
# immediately, and publishes the paperclip jar as a downloadable artifact.
# Skips docs/README/asset-only changes.

on:
  push:
    branches: [ fuji ]
    paths:
      - 'leaf-server/**'
      - 'leaf-api/**'
      - 'build-data/**'
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'leaf-server/**'
      - 'leaf-api/**'
      - 'build-data/**'
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache paperweight (decompile / upstream)
        uses: actions/cache@v4
        with:
          path: |
            .gradle/caches/paperweight
            leaf-server/.gradle/caches/paperweight
          key: paperweight-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build-data/**') }}
          restore-keys: |
            paperweight-${{ runner.os }}-

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Apply all patches
        run: |
          chmod +x ./gradlew
          ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Build paperclip jar
        run: ./gradlew createMojmapPaperclipJar --stacktrace --no-daemon

      - name: Upload paperclip jar
        uses: actions/upload-artifact@v4
        with:
          name: fuji-paperclip-1.21.11
          path: leaf-server/build/libs/*paperclip*.jar
          if-no-files-found: error
