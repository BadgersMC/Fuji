name: Build & Release Fuji

# Builds Fuji on every source/patch change. On a push to `fuji` it also publishes
# a GitHub Release with the paperclip jar (auto build-numbered). Pull requests and
# manual dispatches build + upload an artifact only (no release).

on:
  push:
    branches: [ fuji ]
    paths:
      - 'leaf-server/**'
      - 'leaf-api/**'
      - 'build-data/**'
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'leaf-server/**'
      - 'leaf-api/**'
      - 'build-data/**'
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MC_VERSION: '1.21.11'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cache paperweight (decompile / upstream)
        uses: actions/cache@v4
        with:
          path: |
            .gradle/caches/paperweight
            leaf-server/.gradle/caches/paperweight
          key: paperweight-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build-data/**') }}
          restore-keys: |
            paperweight-${{ runner.os }}-

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Apply all patches
        run: |
          chmod +x ./gradlew
          ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Build paperclip jar
        run: ./gradlew createMojmapPaperclipJar --stacktrace --no-daemon

      - name: Upload paperclip jar (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fuji-paperclip-${{ env.MC_VERSION }}
          path: leaf-server/build/libs/*paperclip*.jar
          if-no-files-found: error

      # ---- Release (only on push to fuji) ----
      - name: Prepare release jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/fuji'
        id: prep
        run: |
          BUILD="${{ github.run_number }}"
          SRC=$(ls leaf-server/build/libs/*paperclip*mojmap.jar | head -1)
          OUT="fuji-${MC_VERSION}-build.${BUILD}.jar"
          cp "$SRC" "$OUT"
          echo "jar=$OUT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$OUT" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/fuji'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.prep.outputs.build }}
          name: Fuji ${{ env.MC_VERSION }} — build ${{ steps.prep.outputs.build }}
          files: ${{ steps.prep.outputs.jar }}
          generate_release_notes: true
          make_latest: true
          body: |
            **Fuji ${{ env.MC_VERSION }}** · build `${{ steps.prep.outputs.build }}` — *the peak of cannoning* 🗻

            | | |
            |---|---|
            | Minecraft | `${{ env.MC_VERSION }}` |
            | Java | `21` |
            | SHA-256 | `${{ steps.prep.outputs.sha256 }}` |

            Run with: `java -Xms4G -Xmx4G -jar ${{ steps.prep.outputs.jar }} --nogui`

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
