name: Build Fuji 26.3

on:
  push:
    branches: ['26.3']
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the tested build as a GitHub prerelease'
        type: boolean
        default: false
        required: false

jobs:
  build:
    if: github.repository == 'BadgersMC/Fuji'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Fuji
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Configure Paperweight Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Build runnable Fuji jar
        run: ./gradlew createLeafclipJar --stacktrace --no-daemon

      - name: Prepare distributable and checksum
        shell: bash
        run: |
          shopt -s nullglob
          jars=(leaf-server/build/libs/leaf-leafclip-26.3*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "Expected one 26.3 Leafclip jar; found ${#jars[@]}"
            ls -lah leaf-server/build/libs/ || true
            exit 1
          fi
          cp "${jars[0]}" "fuji-26.3-${GITHUB_RUN_NUMBER}.jar"
          sha256sum "fuji-26.3-${GITHUB_RUN_NUMBER}.jar" > "fuji-26.3-${GITHUB_RUN_NUMBER}.jar.sha256"

      - name: Upload Fuji build
        uses: actions/upload-artifact@v4
        with:
          name: fuji-26.3-${{ github.run_number }}
          path: |
            fuji-26.3-*.jar
            fuji-26.3-*.jar.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: fuji-26.3-${{ github.run_number }}

      - name: Publish experimental GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fuji-26.3-build-${{ github.run_number }}
          name: Fuji 26.3 experimental build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            fuji-26.3-*.jar
            fuji-26.3-*.jar.sha256
