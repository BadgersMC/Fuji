name: Build Fuji 26.3 Pull Request

on:
  pull_request:
    branches: ['26.3']

jobs:
  build:
    if: github.repository == 'BadgersMC/Fuji'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Fuji
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Configure Paperweight Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon

      - name: Build runnable Fuji jar
        run: ./gradlew createLeafclipJar --stacktrace --no-daemon

      - name: Prepare distributable
        shell: bash
        run: |
          shopt -s nullglob
          jars=(leaf-server/build/libs/leaf-leafclip-26.3*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "Expected one 26.3 Leafclip jar; found ${#jars[@]}"
            ls -lah leaf-server/build/libs/ || true
            exit 1
          fi
          cp "${jars[0]}" fuji-26.3-pr.jar

      - name: Upload Fuji PR build
        uses: actions/upload-artifact@v4
        with:
          name: fuji-26.3-pr-${{ github.event.pull_request.number }}
          path: fuji-26.3-pr.jar
          if-no-files-found: error
          retention-days: 7
